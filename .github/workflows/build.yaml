name: Render and publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write      
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install rquiz
        run: Rscript -e 'install.packages(c("rquiz", "glue", "here"))'

      - name: Set up Typst
        uses: typst-community/setup-typst@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2

      - name: "Install Julia packages"
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
        working-directory: skripte

      - name: "Prepare render 1"
        run: julia --project lernpfad-zusammenstellen.jl
        working-directory: skripte

      - name: "Prepare render 2"
        run: julia --project studienarbeit-zusammenstellen.jl
        working-directory: skripte

      - name: "Render"
        run: |
          quarto render lernpfad/studienarbeit
          quarto render lernpfad/aufgaben -t html
          quarto render lernpfad/folien -t revealjs
          quarto render lernpfad/folien-alle -t html
          quarto render weitere-unterlagen -t html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '__output'

  deploy:
    needs: render
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:    
    - name: Setup Pages
      uses: actions/configure-pages@v5
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

