name: Build C# projects

on:
  push:
    branches: [main]
    paths:
      - "bausteine/**/*.csproj"
      - "bausteine/**/*.slnx"
      - "bausteine/**/*.cs"
      - "bausteine/**/*.axaml"
      - ".github/workflows/dotnet-build.yaml"
  schedule:
    # daily, independent of commits: catches changes from floated
    # package versions (e.g. Avalonia 12.*)
    - cron: "13 4 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('bausteine/**/*.csproj') }}
          restore-keys: nuget-

      - name: Build solutions
        run: make build-dotnet
